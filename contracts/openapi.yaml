openapi: "3.1.0"
info:
  title: Life OS Orchestrator API
  version: "0.1.0"
  description: |
    FastAPI surface for the Life OS LangGraph orchestrator.
    Agent 3 (Frontend) consumes this. Agent 2 (Integrations) is notified of audit/HITL field changes.

servers:
  - url: http://localhost:8000
    description: Local dev

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /runs:
    post:
      operationId: createRun
      summary: Start a new Life OS run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "200":
          description: Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
        "400":
          description: Bad request (e.g. admin roster full)

  /runs/{run_id}:
    get:
      operationId: getRun
      summary: Get full LifeState snapshot + node trace
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: LifeState snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeState"
        "404":
          description: Run not found

  /runs/{run_id}/approve:
    post:
      operationId: approveRun
      summary: Approve or deny a HITL-interrupted run
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
      responses:
        "200":
          description: Run resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeState"
        "404":
          description: Run not found
        "409":
          description: Run not in needs_approval state

  /admins:
    get:
      operationId: listAdmins
      summary: List family Admin roster (no secrets)
      responses:
        "200":
          description: Roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListResponse"
    post:
      operationId: addAdmin
      summary: Owner-only — add admin (refuse at ADMIN_MAX)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAdminRequest"
      responses:
        "200":
          description: Admin added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "400":
          description: Roster full or invalid
        "403":
          description: Caller is not owner

  /admins/{admin_id}:
    delete:
      operationId: removeAdmin
      summary: Owner-only — remove admin (cannot remove last owner)
      parameters:
        - name: admin_id
          in: path
          required: true
          schema:
            type: string
        - name: acting_admin_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
        "403":
          description: Forbidden
        "404":
          description: Not found

  /admins/{admin_id}/oauth/google/start:
    get:
      operationId: startGoogleOAuth
      summary: Begin per-admin Google OAuth consent
      parameters:
        - name: admin_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Auth URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin_id:
                    type: string
                  auth_url:
                    type: string
        "404":
          description: Unknown admin

  /admins/{admin_id}/oauth/status:
    get:
      operationId: oauthStatus
      summary: Google/Notion connection status for an admin
      parameters:
        - name: admin_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStatus"
        "404":
          description: Unknown admin

  /oauth/google/callback:
    get:
      operationId: googleOAuthCallback
      summary: OAuth redirect — exchanges code and stores per-admin token
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: admin_id
          schema:
            type: string
      responses:
        "200":
          description: Token saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStatus"
        "400":
          description: Bad code/state

components:
  schemas:
    CreateRunRequest:
      type: object
      required:
        - trigger_type
        - trigger_payload
      properties:
        trigger_type:
          type: string
          enum: [goal, email, slack]
        trigger_payload:
          description: Raw goal string or email/Slack message dict
          oneOf:
            - type: string
            - type: object
        admin_id:
          type: string
          nullable: true
        source_id:
          type: string
          nullable: true
          description: Idempotency key (message-id, fixture id)

    CreateRunResponse:
      type: object
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [running, needs_approval, pass, abort, error]

    ApproveRequest:
      type: object
      required:
        - decision
        - admin_id
      properties:
        decision:
          type: string
          enum: [approve, deny]
        admin_id:
          type: string

    TriggerDict:
      type: object
      properties:
        type:
          type: string
          enum: [goal, email, slack]
        raw:
          oneOf:
            - type: string
            - type: object
        source_id:
          type: string
          nullable: true

    IntentDict:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [meeting, task, follow_up, info]
        summary:
          type: string
        entities:
          type: object
        confidence:
          type: number
          minimum: 0
          maximum: 1

    PlanStepDict:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        app:
          type: string
        args:
          type: object
        requires_hitl:
          type: boolean
        status:
          type: string
          enum: [pending, done, skipped, blocked]

    LifeState:
      type: object
      properties:
        run_id:
          type: string
        thread_id:
          type: string
        created_at:
          type: string
          format: date-time
        family_id:
          type: string
          nullable: true
        admin_id:
          type: string
          nullable: true
          description: Requester — Google/Notion writes use this admin's OAuth tokens
        shared_with:
          type: array
          items:
            type: string
          description: Other admin_ids who may view this run
        approval_assignee:
          type: string
          nullable: true
        trigger:
          $ref: "#/components/schemas/TriggerDict"
        normalized_context:
          type: object
        intents:
          type: array
          items:
            $ref: "#/components/schemas/IntentDict"
        priority_scores:
          type: object
        selected_intent:
          $ref: "#/components/schemas/IntentDict"
          nullable: true
        plan_steps:
          type: array
          items:
            $ref: "#/components/schemas/PlanStepDict"
        calendar_actions:
          type: array
          items:
            type: object
        drafts:
          type: array
          items:
            type: object
        approvals:
          type: object
          additionalProperties:
            type: string
            enum: [approved, rejected, pending]
        tool_results:
          type: array
          items:
            type: object
        execution_receipts:
          type: array
          items:
            type: object
        errors:
          type: array
          items:
            type: object
        retry_count:
          type: integer
        status:
          type: string
          enum: [running, needs_approval, pass, abort, error]
        needs_approval:
          type: boolean
        audit_ref:
          type: string
          nullable: true

    Admin:
      type: object
      properties:
        admin_id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, operator, viewer]
        email:
          type: string
          nullable: true
        slack_user_id:
          type: string
          nullable: true
        google_token_path:
          type: string
        google_connected:
          type: boolean

    AdminListResponse:
      type: object
      properties:
        family_id:
          type: string
        hitl_policy:
          type: string
        admin_max:
          type: integer
        admins:
          type: array
          items:
            $ref: "#/components/schemas/Admin"

    AddAdminRequest:
      type: object
      required: [acting_admin_id, admin_id, name, role]
      properties:
        acting_admin_id:
          type: string
        admin_id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, operator, viewer]
        email:
          type: string
          nullable: true
        slack_user_id:
          type: string
          nullable: true

    OAuthStatus:
      type: object
      properties:
        admin_id:
          type: string
        google:
          type: string
          enum: [connected, missing]
        token_path:
          type: string
        email:
          type: string
          nullable: true
        mock_mode:
          type: boolean
        connected:
          type: boolean
        notion:
          type: string
          enum: [connected, missing]
          nullable: true
